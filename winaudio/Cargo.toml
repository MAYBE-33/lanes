[package]
name = "winaudio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Lanes' single interface to Windows audio: devices, sessions, endpoint volume, and the undocumented per-app routing and default-device switching."

[dependencies]
serde.workspace = true
# Direct, for the `interface` macro in default_device.rs: like #[implement], it
# expands to code that names ::windows_core at the crate root.
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]
