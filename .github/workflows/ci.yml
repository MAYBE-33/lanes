# Build and check every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is on the runner; the first cargo command installs the exact
      # toolchain rust-toolchain.toml pins, with clippy.
      - name: Rust toolchain
        run: rustup show

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Core - tests
        run: cargo test --release --locked

      - name: Core - lints
        run: cargo clippy --release --locked --all-targets -- -D warnings

      - name: Window - build
        run: dotnet build ui-wpf -c Release
