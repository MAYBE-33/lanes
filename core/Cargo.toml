[package]
name = "lanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Lanes — per-application audio channels for Windows."

[[bin]]
name = "Lanes"
path = "src/main.rs"

[dependencies]
winaudio = { path = "../winaudio" }
windows-core.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tungstenite = "0.30.0"
rand = "0.10.2"
tray-icon = "0.25.1"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    # SHQueryUserNotificationState: is a game full-screen? (new-app notices)
    "Win32_UI_Shell",
]

[build-dependencies]
# Embeds assets/icon.ico as the executable's own icon, so it is not a blank
# page in Explorer, the taskbar or an installer's shortcut.
winresource = "0.1"
